<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='20' width='26' height='7' rx='2' fill='%235b6470'/%3E%3Crect x='5' y='12' width='20' height='9' rx='2' fill='%23c8b458'/%3E%3Crect x='9' y='7' width='12' height='6' rx='2' fill='%23a8923f'/%3E%3Crect x='17' y='8' width='13' height='3' fill='%23a8923f'/%3E%3C/svg%3E">
<title>Battle City</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="wrap">
  <div id="stage">
    <canvas id="game" width="390" height="390"></canvas>
    <div id="overlay" class="hidden">
      <div id="ov-title"></div>
      <div id="ov-sub"></div>
      <div id="ov-hint"></div>
    </div>
  </div>
  <div id="hud">
    <div class="hud-block"><label>ENEMIES</label><div id="hud-enemies"></div></div>
    <div class="hud-block"><label>STAGE</label><div id="hud-stage">1/12</div></div>
    <div class="hud-block"><label>LIVES</label><div id="hud-lives"></div></div>
    <div class="hud-block"><label>SCORE</label><div id="hud-score">0</div></div>
    <div class="hud-block"><label>HIGH</label><div id="hud-high">0</div></div>
  </div>
</main>
<script src="levels.js"></script>
<script src="grid.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
